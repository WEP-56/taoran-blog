# Existing host Caddy owns 80/443; the new blog is available only on loopback.
name: wep-blog
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U blog -d blog"]
      interval: 10s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://blog:${POSTGRES_PASSWORD}@db:5432/blog
    depends_on:
      db:
        condition: service_healthy
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "127.0.0.1:3138:3000"
    environment:
      DATABASE_URL: postgresql://blog:${POSTGRES_PASSWORD}@db:5432/blog
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      SITE_URL: https://taoran.weppp.cyou
      TRUST_PROXY: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
volumes:
  postgres_data:
